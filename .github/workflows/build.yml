name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/MuxTerminal.Core.Tests -c Release

      - name: Publish (single exe, win-x64)
        run: >
          dotnet publish src/MuxTerminal.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MuxTerminal-win-x64
          path: publish/MuxTerminal.exe

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MuxTerminal.sln -c Release

      - name: Test (net8.0 + net48)
        run: dotnet test tests/MuxTerminal.Core.Tests -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: MuxTerminal-net48
          path: |
            src/MuxTerminal.App/bin/Release/net48/
            !src/MuxTerminal.App/bin/Release/net48/**/*.pdb

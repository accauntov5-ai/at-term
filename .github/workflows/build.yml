name: build

on:
  push:            # ветки и теги; тег v* дополнительно публикует релиз
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз с этим тегом, например v1.0.0 (пусто — только сборка)"
        required: false
        default: ""


permissions:
  contents: write  # для публикации релиза по тегу

jobs:
  build:
    runs-on: windows-latest
    env:
      # Тег релиза: из push тега v* или из ручного запуска с параметром release.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name || inputs.release }}
      # Необязательная подпись кода: секреты репозитория SIGN_PFX_BASE64 (сертификат .pfx в base64) и SIGN_PASSWORD.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          # Для тега v1.2.3 версия программы — 1.2.3.
          $version = "$env:RELEASE_TAG".TrimStart('v')
          if ($version) { dotnet build MuxTerminal.sln -c Release -p:Version=$version } else { dotnet build MuxTerminal.sln -c Release }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test (net8.0 + net48)
        run: dotnet test tests/MuxTerminal.Core.Tests -c Release --no-build

      - name: Sign
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "GSM 07.10 MUX Terminal" src/MuxTerminal.App/bin/Release/net48/MuxTerminal.exe
          Remove-Item $pfx

      - name: Self-test (exe alone, without .config, real .NET Framework)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'solo'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src/MuxTerminal.App/bin/Release/net48/MuxTerminal.exe $dir
          $p = Start-Process -FilePath (Join-Path $dir 'MuxTerminal.exe') -ArgumentList '--selftest' -Wait -PassThru
          Get-Content (Join-Path $dir 'selftest.log')
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed: $($p.ExitCode)"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/MuxTerminal.App/bin/Release/net48/MuxTerminal.exe dist/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt dist/
          Compress-Archive -Force -Path dist/* -DestinationPath MuxTerminal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MuxTerminal-exe
          path: dist/

      - name: GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: GSM 07.10 MUX Terminal ${{ env.RELEASE_TAG }}
          body_path: docs/release-notes.md
          files: |
            dist/MuxTerminal.exe
            MuxTerminal.zip
